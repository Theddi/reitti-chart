{{- if and .Values.paikka.enabled .Values.paikka.autoImport.enabled (include "reitti.paikka.pbfUrls" .) }}
# Downloads, filters and imports the configured OSM extracts into paikka's
# data PVC. The paikka pod waits (initContainer) for the completion marker, so
# the app never opens its RocksDB while the import writes it.
#
# Restart-safe: downloads resume (wget -c) and finished regions are skipped,
# so a mid-download failure no longer restarts the whole import from scratch.
# Regular resource on purpose — see the importJobName helper for why this must
# not be a helm hook under ArgoCD.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "reitti.paikka.importJobName" . }}
  labels:
    {{- include "reitti.labels" . | nindent 4 }}
    app.kubernetes.io/component: paikka-import
spec:
  backoffLimit: 30
  template:
    metadata:
      labels:
        app.kubernetes.io/component: paikka-import
    spec:
      restartPolicy: OnFailure
      securityContext:
        {{- toYaml (.Values.paikka.podSecurityContext | default .Values.podSecurityContext) | nindent 8 }}
      containers:
        - name: import
          image: {{ include "reitti.image" (list $ .Values.paikka.image) | quote }}
          imagePullPolicy: {{ .Values.paikka.image.pullPolicy }}
          securityContext:
            {{- toYaml (.Values.paikka.securityContext | default .Values.securityContext) | nindent 12 }}
          command:
            - /bin/bash
            - -ec
            - |
              marker=/data/.helm-autoimport
              if [ -f "$marker" ] && [ "$(cat "$marker")" = "$PBF_URLS" ]; then
                echo "Import: dataset already present, nothing to do."
                exit 0
              fi
              cd /data
              n=0
              files=""
              for url in $PBF_URLS; do
                # key work files by URL hash so reordering/removing regions
                # can never mis-attribute a cached download
                h=$(printf '%s' "$url" | sha256sum | cut -c1-8)
                if [ ! -f "filtered-$h.osm.pbf.done" ]; then
                  echo "Import: downloading $url (resumes partial downloads)"
                  wget -c -O "region-$h.osm.pbf" "$url"
                  echo "Import: filtering $url (osmium)"
                  prepare "region-$h.osm.pbf" "filtered-$h.osm.pbf"
                  touch "filtered-$h.osm.pbf.done"
                  rm -f "region-$h.osm.pbf"
                else
                  echo "Import: $url already downloaded+filtered, skipping"
                fi
                files="$files filtered-$h.osm.pbf"
                n=$((n+1))
              done
              echo "Import: importing $n region(s) with {{ .Values.paikka.autoImport.memory }} heap"
              import --jar-file /app/app.jar --data-dir /data \
                --memory {{ .Values.paikka.autoImport.memory }} \
                {{- with .Values.paikka.autoImport.threads }}
                --threads {{ . }} \
                {{- end }}
                $files
              rm -f filtered-*.osm.pbf filtered-*.osm.pbf.done
              printf '%s' "$PBF_URLS" > "$marker"
              echo "Import: done."
          env:
            - name: PBF_URLS
              value: {{ include "reitti.paikka.pbfUrls" . | quote }}
          {{- with .Values.paikka.autoImport.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- range .Values.paikka.emptyDirs }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ printf "%s-paikka-data" (include "reitti.fullname" .) }}
        {{- range .Values.paikka.emptyDirs }}
        - name: {{ .name }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
