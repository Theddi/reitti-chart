{{- if .Values.paikka.enabled }}
{{- $fullName := include "reitti.fullname" . }}
{{- $name := printf "%s-paikka" $fullName }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "reitti.labels" . | nindent 4 }}
    app.kubernetes.io/component: paikka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "reitti.componentSelectorLabels" (list $ "paikka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reitti.componentSelectorLabels" (list $ "paikka") | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml (.Values.paikka.podSecurityContext | default .Values.podSecurityContext) | nindent 8 }}
      {{- if and .Values.paikka.autoImport.enabled (include "reitti.paikka.pbfUrls" .) }}
      {{- if not .Values.paikka.persistence.data.enabled }}
      {{- fail "paikka.autoImport needs paikka.persistence.data.enabled (the import job and the app must share the data PVC)" }}
      {{- end }}
      # The heavy lifting happens in the paikka-import Job; this init only
      # waits for its completion marker. Waiting is restart-free, so pod
      # restarts during an hours-long import cost nothing — and the app never
      # opens its RocksDB while the job writes it.
      initContainers:
        - name: wait-for-import
          image: {{ include "reitti.image" (list $ .Values.waitFor.image) | quote }}
          imagePullPolicy: {{ .Values.waitFor.image.pullPolicy }}
          securityContext:
            {{- toYaml (.Values.paikka.securityContext | default .Values.securityContext) | nindent 12 }}
          command:
            - /bin/sh
            - -ec
            - |
              marker=/data/.helm-autoimport
              until [ -f "$marker" ] && [ "$(cat "$marker")" = "$PBF_URLS" ]; do
                echo "Waiting for import job {{ include "reitti.paikka.importJobName" . }} ..."
                sleep 10
              done
              echo "Import data present."
          env:
            - name: PBF_URLS
              value: {{ include "reitti.paikka.pbfUrls" . | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: data
              mountPath: /data
      {{- end }}
      containers:
        - name: paikka
          image: {{ include "reitti.image" (list $ .Values.paikka.image) | quote }}
          imagePullPolicy: {{ .Values.paikka.image.pullPolicy }}
          securityContext:
            {{- toYaml (.Values.paikka.securityContext | default .Values.securityContext) | nindent 12 }}
          # The image entrypoint uses `runuser`, which only works as root. We
          # already run as the image's paikka user (uid 1000), so start the jar
          # directly (from /data, as the entrypoint would).
          command:
            - /bin/sh
            - -c
            - cd /data && exec java $JAVA_OPTS -jar /app/app.jar -Dspring.profiles.active=docker
          ports:
            - name: http
              containerPort: {{ .Values.paikka.containerPort }}
              protocol: TCP
          env:
            - name: BASE_URL
              value: {{ include "reitti.paikka.baseUrl" . | quote }}
            {{- if .Values.paikka.admin.existingSecret.name }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.paikka.admin.existingSecret.name | quote }}
                  key: {{ .Values.paikka.admin.existingSecret.key | quote }}
            {{- else if .Values.paikka.admin.password }}
            - name: ADMIN_PASSWORD
              value: {{ .Values.paikka.admin.password | quote }}
            {{- end }}
            {{- with .Values.paikka.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.paikka.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.paikka.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: stats
              mountPath: /stats
            {{- range .Values.paikka.emptyDirs }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
      volumes:
        - name: data
        {{- if .Values.paikka.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
        - name: stats
        {{- if .Values.paikka.persistence.stats.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-stats
        {{- else }}
          emptyDir: {}
        {{- end }}
        {{- range .Values.paikka.emptyDirs }}
        - name: {{ .name }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "reitti.labels" . | nindent 4 }}
    app.kubernetes.io/component: paikka
spec:
  type: {{ .Values.paikka.service.type }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.paikka.service.port }}
      targetPort: http
  selector:
    {{- include "reitti.componentSelectorLabels" (list $ "paikka") | nindent 4 }}
{{- if .Values.paikka.persistence.data.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "reitti.labels" . | nindent 4 }}
    app.kubernetes.io/component: paikka
spec:
  accessModes:
    - {{ .Values.paikka.persistence.data.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.paikka.persistence.data.size | quote }}
  {{- with .Values.paikka.persistence.data.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if .Values.paikka.persistence.stats.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-stats
  labels:
    {{- include "reitti.labels" . | nindent 4 }}
    app.kubernetes.io/component: paikka
spec:
  accessModes:
    - {{ .Values.paikka.persistence.stats.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.paikka.persistence.stats.size | quote }}
  {{- with .Values.paikka.persistence.stats.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
---
{{ include "reitti.componentIngress" (dict "root" $ "svcName" $name "svcPort" .Values.paikka.service.port "ing" .Values.paikka.ingress "component" "paikka") }}
---
{{ include "reitti.componentHTTPRoute" (dict "root" $ "svcName" $name "svcPort" .Values.paikka.service.port "route" .Values.paikka.httproute "component" "paikka") }}
{{- end }}
